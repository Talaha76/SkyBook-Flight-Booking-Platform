global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: skybook
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080', 'flight-search:3001', 'booking:3002', 'inventory:3003', 'payment:3004', 'notification:3005']

  - job_name: skybook-bridge   # only up when started with --profile aws
    metrics_path: /metrics
    static_configs:
      - targets: ['aws-bridge:3006']
