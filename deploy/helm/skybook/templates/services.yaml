{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skybook-{{ $name }}
  labels: {{- include "skybook.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: skybook }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: skybook }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: skybook-app
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: {{ $name }}
          image: {{ include "skybook.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["node", {{ $svc.entry | quote }}]
          ports: [{ name: http, containerPort: {{ $svc.port }} }]
          env:
            {{- include "skybook.commonEnv" $ | nindent 12 }}
            - name: PORT
              value: {{ $svc.port | quote }}
            {{- if $svc.database }}
            - name: DATABASE_URL
              value: "postgres://{{ $.Values.connections.postgresUser }}:$(PGPASSWORD)@{{ $.Values.connections.postgresHost }}:5432/{{ $svc.database }}"
            {{- end }}
            {{- if eq $name "gateway" }}
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "skybook.secretName" $ }}, key: jwtSecret } }
            - name: DEMO_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "skybook.secretName" $ }}, key: demoPassword } }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ if eq $name "gateway" }}/health{{ else }}/ready{{ end }}, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: skybook-{{ $name }}
  labels: {{- include "skybook.labels" $ | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: skybook }
  ports: [{ name: http, port: {{ $svc.port }}, targetPort: http }]
{{- end }}
