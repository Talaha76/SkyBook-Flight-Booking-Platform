{{- if .Values.infra.enabled }}
# ---- DEV-ONLY in-cluster infrastructure for kind. On EKS use RDS / ElastiCache / MSK instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skybook-postgres-init
data:
  init.sql: |
    CREATE DATABASE skybook_flights;
    CREATE DATABASE skybook_booking;
    CREATE DATABASE skybook_inventory;
    CREATE DATABASE skybook_payment;
    CREATE DATABASE skybook_notification;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skybook-postgres
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.postgresImage }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "skybook.secretName" . }}, key: postgresPassword } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "postgres"] }, periodSeconds: 5 }
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - { name: init, configMap: { name: skybook-postgres-init } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: skybook-postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skybook-redis
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.infra.redisImage }}
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: skybook-redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skybook-kafka
spec:
  replicas: 1
  # Never run two single-node brokers side by side during an update (both would claim node id 1).
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka } }
    spec:
      enableServiceLinks: false   # avoid KAFKA_* env vars injected by the Service clashing with broker config
      containers:
        - name: kafka
          image: {{ .Values.infra.kafkaImage }}
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://skybook-kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: skybook-kafka }
spec:
  # Kafka advertises skybook-kafka:9092, so the broker must be reachable through this Service
  # before it is "ready" - otherwise readiness (and every client) waits forever.
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: kafka }
  ports: [{ port: 9092 }]
{{- end }}
