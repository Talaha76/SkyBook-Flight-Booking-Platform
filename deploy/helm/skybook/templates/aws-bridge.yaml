{{- if .Values.awsBridge.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-bridge
  labels: {{- include "skybook.labels" . | nindent 4 }}
  {{- with .Values.awsBridge.serviceAccountAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skybook-aws-bridge
  labels: {{- include "skybook.labels" . | nindent 4 }}
    app.kubernetes.io/name: aws-bridge
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: aws-bridge, app.kubernetes.io/part-of: skybook }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aws-bridge, app.kubernetes.io/part-of: skybook }
    spec:
      serviceAccountName: aws-bridge   # IRSA: credentials come from the annotated role, never from keys
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: aws-bridge
          image: {{ include "skybook.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/services/aws-bridge/src/index.js"]
          ports: [{ name: http, containerPort: {{ .Values.awsBridge.port }} }]
          env:
            - { name: KAFKA_BROKERS, value: {{ .Values.connections.kafkaBrokers | quote }} }
            - { name: PORT, value: {{ .Values.awsBridge.port | quote }} }
            - { name: AWS_REGION, value: {{ .Values.awsBridge.region | quote }} }
            - { name: SQS_QUEUE_URL, value: {{ required "awsBridge.queueUrl is required" .Values.awsBridge.queueUrl | quote }} }
            {{- if .Values.awsBridge.endpoint }}
            - { name: SQS_ENDPOINT, value: {{ .Values.awsBridge.endpoint | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
