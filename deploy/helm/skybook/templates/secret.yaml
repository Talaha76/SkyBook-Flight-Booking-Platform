{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: skybook-secrets
  labels: {{- include "skybook.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  internalToken: {{ .Values.secrets.internalToken | quote }}
  demoPassword: {{ .Values.secrets.demoPassword | quote }}
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
